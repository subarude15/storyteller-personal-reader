name: ink+amp iOS build

on:
  push:
    branches: [punk-rally-ios, "cursor/**"]
  pull_request:
    branches: [punk-rally-ios]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  LANG: en_US.UTF-8
  SILVERAN_DISABLE_CODE_SIGNING: "1"
  SILVERAN_IOS_DESTINATION: "generic/platform=iOS Simulator"

jobs:
  build:
    name: iOS Simulator Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Install tools
        run: brew install xcbeautify xcodegen imagemagick

      - name: Generate app icons
        run: ./scripts/genicons

      - name: Stamp build identity + generate Xcode project
        run: |
          chmod +x scripts/stamp-build scripts/genxproj
          ./scripts/stamp-build
          ./scripts/genxproj

      - name: Build iOS target
        run: ./scripts/iosbuild

  ipa:
    name: Sideload Device IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Install tools
        run: brew install xcbeautify xcodegen imagemagick

      - name: Generate app icons
        run: ./scripts/genicons

      - name: Stamp build identity + generate Xcode project
        run: |
          chmod +x scripts/stamp-build scripts/genxproj
          ./scripts/stamp-build
          ./scripts/genxproj

      - name: Build and package unsigned device IPA
        run: ./scripts/package-ipa "Silveran Reader Sideload (iOS)" Release .buildIosDevice punkrally-sideload-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: punkrally-sideload-unsigned-ipa
          path: .buildIosDevice/punkrally-sideload-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
