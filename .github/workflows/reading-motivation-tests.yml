name: Reading motivation Swift tests

on:
  push:
    branches: ["cursor/**"]
    paths:
      - "SilveranKit/Sources/Kit/Stats/**"
      - "SilveranKit/Sources/AppleKit/WidgetSupport/ContinueWidgetSnapshotStore.swift"
      - "SilveranKit/Sources/AppleKit/MobileDesktop/ContinueWidgetPublisher.swift"
      - "SilveranKit/Tests/SilveranTests/**"
      - "SilveranWidgets/Sources/InkAmpContinueWidget.swift"
      - "XCodeApps/PunkRallyApp.swift"
      - "XCodeApps/PunkRallyModules/Home/HomeMixedQueue.swift"
      - "XCodeApps/PunkRallyModules/Stats/SessionTracker.swift"
      - "XCodeApps/PunkRallyModules/Stats/StatsView.swift"
      - "XCodeApps/PunkRallyModules/Motivation/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/test"
      - ".github/workflows/reading-motivation-tests.yml"
  pull_request:
    branches: [main, punk-rally-ios]
    paths:
      - "SilveranKit/Sources/Kit/Stats/**"
      - "SilveranKit/Sources/AppleKit/WidgetSupport/ContinueWidgetSnapshotStore.swift"
      - "SilveranKit/Sources/AppleKit/MobileDesktop/ContinueWidgetPublisher.swift"
      - "SilveranKit/Tests/SilveranTests/**"
      - "SilveranWidgets/Sources/InkAmpContinueWidget.swift"
      - "XCodeApps/PunkRallyApp.swift"
      - "XCodeApps/PunkRallyModules/Home/HomeMixedQueue.swift"
      - "XCodeApps/PunkRallyModules/Stats/SessionTracker.swift"
      - "XCodeApps/PunkRallyModules/Stats/StatsView.swift"
      - "XCodeApps/PunkRallyModules/Motivation/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/test"
      - ".github/workflows/reading-motivation-tests.yml"
  workflow_dispatch:

concurrency:
  group: reading-motivation-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-tests:
    name: SilveranKit regression tests
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Diagnose widget race handshake tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          swift test list 2>&1 | tee widget-test-inventory.log
          ./scripts/test --filter 'concurrentPublishPreservesFresherStreakAcrossAudioHomeRace|publishLiveMirrorSeamPreservesFresherHomeStreakDuringAudioRace' 2>&1 | tee widget-race-diagnostic.log
          python3 -c 'from pathlib import Path; s=Path("widget-race-diagnostic.log").read_text(); names=["concurrentPublishPreservesFresherStreakAcrossAudioHomeRace", "publishLiveMirrorSeamPreservesFresherHomeStreakDuringAudioRace"]; assert all("Test " + n + "() started." in s for n in names), "Both diagnostic tests must actually execute"'

      - name: Run Swift package tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test --skip-build 2>&1 | tee reading-motivation-tests.log

      - name: Retain Swift test log and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-motivation-swift-test-results
          path: |
            reading-motivation-tests.log
            widget-race-diagnostic.log
            widget-test-inventory.log
          if-no-files-found: warn
          retention-days: 14
